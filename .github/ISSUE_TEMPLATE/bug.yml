name: Bug report
description: Something is wrong
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: Version, description: "Output of `mote --version`", placeholder: "mote 0.9.0-beta.1 (prod)" }
    validations: { required: true }
  - type: input
    id: system
    attributes: { label: System, description: "Distribution, session (X11/Wayland), how you installed (deb/AppImage/tarball/Flatpak), IME if relevant", placeholder: "Ubuntu 24.04, Wayland, .deb, ibus-hangul" }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps, description: "What you did, what happened, what you expected. Attach a small .md that shows it if you can." }
    validations: { required: true }
